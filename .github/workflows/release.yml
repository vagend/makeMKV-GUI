# Builds MKVRipper.exe every time you push to main and puts it on the repo's Releases page
# as the latest release. The app checks that release's build number to update itself.
name: Build MKVRipper.exe

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore"]
  workflow_dispatch:   # lets you start a build from the Actions tab

permissions:
  contents: write      # needed to publish the release

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build number
        shell: bash
        run: echo "${{ github.run_number }}" > APP_BUILD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        run: |
          python -m pip install --upgrade pip pyinstaller sv-ttk darkdetect
          pyinstaller --noconfirm --clean --onefile --windowed --name MKVRipper --add-data "APP_BUILD;." --collect-data sv_ttk mkv_ripper.py

      - name: Screenshot the UI (light and dark)
        shell: pwsh
        run: |
          python -m pip install pillow
          New-Item -ItemType Directory -Force shots | Out-Null
          foreach ($t in "Light", "Dark") {
            $env:MKVRIPPER_THEME = $t
            $env:MKVRIPPER_SCREENSHOT = "$PWD\shots\$t"
            python mkv_ripper.py
          }
          Get-ChildItem shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 3

      - name: Build installer
        shell: pwsh
        run: |
          # per-user install, Start menu entry, Settings > Apps entry with Uninstall
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (!(Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" "/DSourceExe=$PWD\dist\MKVRipper.exe" "/O$PWD\dist" packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the installer
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\MKV Ripper"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MKV Ripper.lnk"
          Start-Process dist\MKVRipper-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (!(Test-Path "$app\MKVRipper.exe")) { throw "app not installed" }
          if (!(Test-Path $lnk)) { throw "no Start menu entry" }
          $u = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object DisplayName -eq "MKV Ripper"
          if (!$u) { throw "not listed under Apps" }
          "Installed: $($u.DisplayName) $($u.DisplayVersion)"
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$app\MKVRipper.exe") { throw "uninstall left the app behind" }
          if (Test-Path $lnk) { throw "uninstall left the Start menu entry" }
          "Uninstalled cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: MKVRipper
          path: |
            dist/MKVRipper.exe
            dist/MKVRipper-setup.exe
          if-no-files-found: error
          retention-days: 3   # only needed until the release step

  release:
    needs: build
    if: github.ref == 'refs/heads/main'   # test branches build but don't publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MKVRipper
          path: out

      - name: Publish "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/MKVRipper-setup.exe out/MKVRipper.exe \
            --target "$GITHUB_SHA" \
            --title "MKV Ripper (build ${{ github.run_number }})" \
            --latest \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC.

          **Install:** download **MKVRipper-setup.exe** and run it. It installs just for you (no admin needed), adds MKV Ripper to the Start menu, and can be uninstalled from Settings > Apps.
          (MKVRipper.exe on its own also runs without installing; it's also what the app downloads to update itself.)

          If MakeMKV or MKVToolNix is missing, the app offers to install it.

          Windows SmartScreen may warn that the app isn't from a known publisher: click **More info > Run anyway**."
