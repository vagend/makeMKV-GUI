# Builds MKVRipper.exe every time you push to main and puts it on the repo's Releases page
# as the latest release. The app checks that release's build number to update itself.
name: Build MKVRipper.exe

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore"]
  workflow_dispatch:   # lets you start a build from the Actions tab

permissions:
  contents: write      # needed to publish the release

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build number
        shell: bash
        run: echo "${{ github.run_number }}" > APP_BUILD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name MKVRipper --add-data "APP_BUILD;." mkv_ripper.py

      - uses: actions/upload-artifact@v4
        with:
          name: MKVRipper
          path: dist/MKVRipper.exe
          if-no-files-found: error
          retention-days: 3   # only needed until the release step

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MKVRipper
          path: out

      - name: Publish "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/MKVRipper.exe \
            --target "$GITHUB_SHA" \
            --title "MKV Ripper (build ${{ github.run_number }})" \
            --latest \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC.

          Download **MKVRipper.exe** and run it. No install or Python needed. If MakeMKV or MKVToolNix is missing, the app offers to install it.

          Windows SmartScreen may warn that the app isn't from a known publisher: click **More info > Run anyway**."
