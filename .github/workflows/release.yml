# Builds MKV Ripper for Windows (MKVRipper.exe + installer) and Mac (Apple Silicon and Intel) every time
# you push to main and puts them on the repo's Releases page as the latest release.
# The app checks that release's build number to update itself.
name: Build MKV Ripper

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore", "LICENSE", "docs/**"]
  workflow_dispatch:   # lets you start a build from the Actions tab

permissions:
  contents: write      # needed to publish the release

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build number
        shell: bash
        run: echo "${{ github.run_number }}" > APP_BUILD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -c "import webview, mkv_ripper; print('pywebview', webview.__version__ if hasattr(webview, '__version__') else '')"
          pyinstaller --noconfirm --clean MKVRipper.spec

      - name: Check the app opens
        shell: pwsh
        run: |
          $env:MKVRIPPER_SMOKE = "$PWD\smoke.txt"
          $p = Start-Process dist\MKVRipper.exe -PassThru
          if (!$p.WaitForExit(60000)) { Stop-Process $p -Force; throw "app didn't finish loading within 60 s" }
          if (!(Test-Path smoke.txt)) { throw "app closed without loading its page" }
          $r = Get-Content smoke.txt
          "Page check: $r"
          if ($r -notmatch "MKV Ripper / api:object") { throw "page or Python bridge didn't load: $r" }
          if ($r -notmatch "https:truststore[._a-z]* / (latest|http-status):\d+") { throw "update check over HTTPS failed: $r" }

      - name: Build installer
        shell: pwsh
        run: |
          # per-user install, Start menu entry, Settings > Apps entry with Uninstall
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (!(Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" "/DSourceExe=$PWD\dist\MKVRipper.exe" "/O$PWD\dist" packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the installer
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\MKV Ripper"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MKV Ripper.lnk"
          Start-Process dist\MKVRipper-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (!(Test-Path "$app\MKVRipper.exe")) { throw "app not installed" }
          if (!(Test-Path $lnk)) { throw "no Start menu entry" }
          $u = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object DisplayName -eq "MKV Ripper"
          if (!$u) { throw "not listed under Apps" }
          "Installed: $($u.DisplayName) $($u.DisplayVersion)"
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$app\MKVRipper.exe") { throw "uninstall left the app behind" }
          if (Test-Path $lnk) { throw "uninstall left the Start menu entry" }
          "Uninstalled cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: MKVRipper
          path: |
            dist/MKVRipper.exe
            dist/MKVRipper-setup.exe
          if-no-files-found: error
          retention-days: 3   # only needed until the release step

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1 and later)
            arch: AppleSilicon
          - runner: macos-15-intel    # Intel Macs
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build number
        run: echo "${{ github.run_number }}" > APP_BUILD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --noconfirm --clean MKVRipper.spec
          APP="dist/MKV Ripper.app"
          # ad-hoc signature: without one, macOS 15.1+ won't offer "Open Anyway" for a downloaded app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          file "$APP/Contents/MacOS/MKVRipper"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

      - name: Check the app opens
        run: |
          export MKVRIPPER_SMOKE="$PWD/smoke.txt"
          "dist/MKV Ripper.app/Contents/MacOS/MKVRipper" &
          pid=$!
          for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "app didn't finish loading within 90 s"; exit 1; fi
          test -f smoke.txt || { echo "app closed without loading its page"; exit 1; }
          r=$(cat smoke.txt); echo "Page check: $r"
          echo "$r" | grep -q "MKV Ripper / api:object" || { echo "page or Python bridge didn't load"; exit 1; }
          echo "$r" | grep -Eq "https:truststore[._a-z]* / (latest|http-status):[0-9]+" || { echo "update check over HTTPS failed"; exit 1; }

      - name: Zip the app
        run: |
          # ditto keeps the app's permissions, links and signature intact
          ditto -c -k --keepParent "dist/MKV Ripper.app" "dist/MKVRipper-mac-${{ matrix.arch }}.zip"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MKVRipper-mac-${{ matrix.arch }}
          path: dist/MKVRipper-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [build, mac]
    if: github.ref == 'refs/heads/main'   # test branches build but don't publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MKVRipper*
          merge-multiple: true
          path: out

      - name: Publish "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          echo "${{ github.run_number }}" > out/BUILD.txt   # what the app reads to see if it's out of date
          ls -la out
          gh release create latest out/MKVRipper-setup.exe out/MKVRipper.exe out/BUILD.txt \
            out/MKVRipper-mac-AppleSilicon.zip out/MKVRipper-mac-Intel.zip \
            --target "$GITHUB_SHA" \
            --title "MKV Ripper (build ${{ github.run_number }})" \
            --latest \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC.

          **Windows:** download **MKVRipper-setup.exe** and run it. It installs just for you (no admin needed), adds MKV Ripper to the Start menu, and can be uninstalled from Settings > Apps.
          (MKVRipper.exe on its own also runs without installing; it's also what the app downloads to update itself.)

          If MakeMKV or MKVToolNix is missing, the app offers to install it.

          Windows SmartScreen may warn that the app isn't from a known publisher: click **More info > Run anyway**.

          **Mac:** download **MKVRipper-mac-AppleSilicon.zip** for an M1/M2/M3/M4 Mac, or **MKVRipper-mac-Intel.zip** for an Intel Mac (Apple menu > About This Mac shows which). Open the zip and drag **MKV Ripper** into Applications.
          The first time, macOS says it can't verify the app: click **Done**, open **System Settings > Privacy & Security**, scroll down and click **Open Anyway**. After that it opens normally and updates itself.
          Install MakeMKV from makemkv.com; the app offers MKVToolNix through Homebrew if you have it, or its download page."
