<style>
:root {
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #f8f9fb; --border: #e3e6eb; --border-strong: #d0d5dd;
  --text: #111827; --muted: #6b7280; --faint: #9ca3af;
  --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eaf1ff; --accent-text: #1d4ed8;
  --ok: #12a150; --ok-soft: #e7f6ed; --ok-text: #0b7a3b;
  --danger: #d92d20; --danger-soft: #fdecea; --warn: #b54708; --warn-soft: #fff4e5;
  --track: #e8ebef; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --shadow-lg: 0 20px 40px -12px rgba(16,24,40,.28);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1013; --surface: #171a1f; --surface-2: #1d2127; --border: #262b33; --border-strong: #353b45;
    --text: #e8eaed; --muted: #9aa3af; --faint: #6b7280;
    --accent: #3b82f6; --accent-hover: #5b95f8; --accent-soft: #14213a; --accent-text: #7fb0ff;
    --ok: #1fb862; --ok-soft: #11291b; --ok-text: #4ad387;
    --danger: #f97066; --danger-soft: #2d1614; --warn: #fdb022; --warn-soft: #2b2010;
    --track: #262b33; --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 24px 48px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; overflow: hidden; user-select: none;
}
input { user-select: text; }
button, input, select { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- header ---------- */
header { display: flex; align-items: center; gap: 12px; padding: 14px 24px 10px; flex: none; }
.logo { width: 34px; height: 34px; flex: none; display: grid; filter: drop-shadow(0 1px 2px rgba(0,0,0,.18)); }
.logo svg { width: 34px; height: 34px; }
.brand { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.brand small { font-weight: 450; color: var(--muted); font-size: 13px; margin-left: 6px; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); height: 28px;
  padding: 0 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.chip.ok .dot { background: var(--ok); }
.chip.warn { color: var(--warn); } .chip.warn .dot { background: var(--warn); }
.chip.bad { color: var(--danger); } .chip.bad .dot { background: var(--danger); }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--border-strong); color: var(--text); }
.updchip { background: var(--accent-soft); color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 35%, transparent); font-weight: 600; }

/* ---------- layout ---------- */
main { flex: 1; min-height: 0; overflow: auto; padding: 0 24px 14px; display: flex; flex-direction: column; gap: 12px;
  scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 18px; }
.card { flex: none; }
.card.grow { flex: 1 1 0; min-height: 300px; display: flex; flex-direction: column; }
.card-h.inline { margin: 0; flex-wrap: nowrap; }
.card-h.inline h2 { width: 94px; flex: none; }
.form { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; margin-top: 12px; }
.form > .lbl { color: var(--muted); font-size: 13px; font-weight: 550; padding-left: 34px; }
.form .hint { grid-column: 2 / 4; margin: -2px 0 2px; }
.epwrap { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.step { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent-text); flex: none; }
.card-h h2 { font-size: 15px; font-weight: 650; margin: 0; }
.card-h .sub { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow1 { flex: 1; min-width: 160px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px;
  border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer;
  font-weight: 550; white-space: nowrap; transition: background .12s, border-color .12s, transform .05s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.big { height: 44px; padding: 0 22px; font-size: 15px; border-radius: 10px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn.icon { width: 36px; padding: 0; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.input, select.input { height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border-strong);
  background: var(--surface-2); outline: none; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.input.num { width: 76px; text-align: center; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 550; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.seg button { height: 30px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; cursor: pointer;
  color: var(--muted); font-weight: 550; display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.hint code { font: 12px ui-monospace, Consolas, monospace; color: var(--text); background: var(--surface-2);
  border: 1px solid var(--border); padding: 1px 6px; border-radius: 5px; }
.callout { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 10px; }
.callout.info { background: var(--ok-soft); color: var(--ok-text); }
.callout.warn { background: var(--warn-soft); color: var(--warn); }
.callout.err { background: var(--danger-soft); color: var(--danger); }
.callout .btn { margin-left: auto; }

/* ---------- title list ---------- */
.tlist { flex: 1; min-height: 120px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
  scrollbar-width: thin; }
.trow { display: grid; grid-template-columns: 24px 54px 74px 80px 84px minmax(160px, 196px) minmax(0, 1fr);
  gap: 12px; align-items: center; padding: 0 14px; min-height: 44px; border-bottom: 1px solid var(--border); }
.trow:last-child { border-bottom: 0; }
.trow.head { min-height: 34px; position: sticky; top: 0; z-index: 1; background: var(--surface-2); font-size: 11.5px;
  text-transform: uppercase; letter-spacing: .04em; color: var(--faint); font-weight: 650; }
.trow.t { cursor: pointer; }
.trow.t:hover { background: var(--surface); }
.trow.t.on { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.trow.t.skip .len, .trow.t.skip .num { color: var(--faint); }
.trow input[type=checkbox] { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; pointer-events: none; }
.trow .num { font-weight: 650; font-variant-numeric: tabular-nums; }
.trow .len, .trow .ch, .trow .sz { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.trow .len { color: var(--text); }
.trow .out { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.trow .out .arrow { color: var(--faint); margin: 0 4px; }
.trow .out.none { color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; white-space: nowrap; font-weight: 550; max-width: 100%; }
.pill svg.i { width: 14px; height: 14px; }
.pill:hover { border-color: var(--border-strong); color: var(--text); }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.pill.mute { cursor: default; background: transparent; border-style: dashed; }
.pill.none { cursor: default; border-color: transparent; background: transparent; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 30px 20px; }
.empty svg { width: 42px; height: 42px; color: var(--faint); stroke-width: 1.5; margin-bottom: 8px; }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.listbar { display: flex; align-items: center; gap: 6px; margin-left: auto; }
@media (max-width: 980px) { .trow { grid-template-columns: 24px 50px 70px 0 0 minmax(150px, 180px) minmax(0, 1fr); gap: 10px; }
  .trow .ch, .trow .sz { visibility: hidden; } }
@media (max-width: 860px) { .chip.tool { display: none; } }

/* ---------- footer ---------- */
footer { flex: none; display: flex; align-items: center; gap: 16px; padding: 12px 24px 14px; background: var(--surface);
  border-top: 1px solid var(--border); }
.prog { flex: 1; min-width: 0; }
.prog .bar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; margin-bottom: 6px; }
.prog .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s; }
.prog .bar.indet i { width: 30%; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.prog .st { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog .st b { color: var(--text); font-weight: 600; }
.logbox { flex: none; height: 180px; margin: 0; padding: 10px 24px; overflow: auto; background: var(--surface-2); border-top: 1px solid var(--border);
  font: 12px/1.5 "Cascadia Mono", Consolas, ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; user-select: text; }

/* ---------- dialogs ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15, 18, 24, .45); display: grid; place-items: center; padding: 20px; z-index: 50;
  animation: fade .12s ease-out; }
@keyframes fade { from { opacity: 0; } }
.dlg { width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--surface);
  border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); animation: pop .14s ease-out; }
@keyframes pop { from { transform: translateY(6px) scale(.98); opacity: 0; } }
.dlg .dh { padding: 18px 20px 6px; }
.dlg .dh h3 { margin: 0; font-size: 17px; font-weight: 650; }
.dlg .dh p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.dlg .content { padding: 12px 20px; overflow: auto; }
.dlg .df { display: flex; gap: 8px; align-items: center; padding: 14px 20px 18px; flex-wrap: wrap; }
.dlg .df .spacer { flex: 1; }
.opt { display: block; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
.opt:hover { border-color: var(--border-strong); }
.opt.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.opt .ot { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.opt .ot input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.opt .ob { margin: 8px 0 0 26px; color: var(--muted); font-size: 13px; }
.opt:not(.on) .ob .row { opacity: .45; pointer-events: none; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 9px; overflow: hidden; }
.stepper button { width: 34px; height: 34px; border: 0; background: var(--surface-2); cursor: pointer; font-size: 17px; }
.stepper button:hover { background: var(--track); }
.stepper input { width: 46px; height: 34px; border: 0; text-align: center; background: var(--surface); outline: none; font-weight: 600; }
.mono { font: 13px ui-monospace, Consolas, monospace; }
.setrow { padding: 12px 0; border-bottom: 1px solid var(--border); }
.setrow:last-child { border-bottom: 0; }
.setrow .sh { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
.setrow .sh .chip { margin-left: auto; }
.filelist { margin: 8px 0 0; padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  font: 12.5px ui-monospace, Consolas, monospace; max-height: 160px; overflow: auto; }

/* ---------- toasts ---------- */
.toasts { position: fixed; right: 20px; top: 64px; display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(380px, calc(100% - 40px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--border); box-shadow: var(--shadow-lg); font-size: 13px; animation: pop .14s ease-out; }
.toast.error { border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
.toast .ti { color: var(--ok); } .toast.error .ti { color: var(--danger); }
.toast .x { margin-left: auto; cursor: pointer; color: var(--faint); background: none; border: 0; padding: 0; }
table.lens { width: 100%; border-collapse: collapse; font-size: 13px; }
table.lens td { padding: 5px 8px; border-top: 1px solid var(--border); }
table.lens tr:first-child td { border-top: 0; }
table.lens td.r { text-align: right; font-weight: 600; }
table.lens tr.off td { color: var(--warn); }
.warnTxt { color: var(--warn) !important; }
.lenline { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; }
.chaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 4px 12px; font-size: 12px; margin-top: 6px; }
.chaps span { color: var(--muted); } .chaps b { color: var(--text); font-weight: 500; margin-left: 6px; }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chk input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
</style>
</head>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const icon = (n, st = "") => `<svg class="i" ${st ? `style="${st}"` : ""}><use href="#i-${n}"/></svg>`;
let api = null;

const S = {                       // what the user has chosen
  mode: "tv", prefix: "S1E", start: 1, movie: "", movieFolder: false, out: "", minlen: 120,
  checked: new Set(), how: {},    // how[id] = {how: "split"|"whole", eps, pts}
  names: {}, nameErr: "",
};
let B = { titles: [], drives: [], play_all: {}, tools: {}, busy: false, scan_id: 0, notices: [] };   // last state from Python
let seenScan = 0, seenNotice = 0, logFrom = 0, lastResult = null, drivesKey = "";

/* ---------- helpers ---------- */
const byId = id => B.titles.find(t => t.id === id);
const isPlayAll = t => String(t.id) in (B.play_all || {});
const likelyMulti = t => S.mode === "tv" && t.secs >= 70 * 60 && t.chapters >= 4 && !S.how[t.id] && !isPlayAll(t);
function multiName(first, last) {
  const m = S.prefix.match(/[Ee](0*)$/);
  return `${S.prefix}${first}-E${m ? m[1] : ""}${last}.mkv`;
}
function guessPts(chapters, n) {
  if (n < 2 || chapters < n || chapters % n) return null;
  const step = chapters / n; return Array.from({length: n - 1}, (_, k) => 1 + step * (k + 1));
}
/* episode lengths from chapter start times (seconds) and cut chapters (1-based) */
function autoPts(times, total, n) {
  if (!times || n < 2 || times.length < n || total <= 0) return null;
  const pts = []; let prev = 1;
  for (let k = 1; k < n; k++) {
    const target = total * k / n; let best = null;
    for (let c = prev + 1; c <= times.length - (n - 1 - k); c++)
      if (best === null || Math.abs(times[c - 1] - target) < Math.abs(times[best - 1] - target)) best = c;
    if (best === null) return null;
    pts.push(best); prev = best;
  }
  return pts;
}
function epLengths(times, total, pts) {
  const starts = [0, ...pts.map(p => times[p - 1])], ends = [...pts.map(p => times[p - 1]), total];
  return starts.map((a, i) => ({ from: i ? pts[i - 1] : 1, to: i < pts.length ? pts[i] - 1 : times.length, secs: ends[i] - a }));
}
function fmtLen(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
/* table of episode lengths; flags any episode far from the average so a bad cut stands out */
function lengthsTable(times, total, pts, names) {
  const L = epLengths(times, total, pts), avg = total / L.length;
  const rows = L.map((e, i) => {
    const off = Math.abs(e.secs - avg) / avg > 0.15;
    return `<tr class="${off ? "off" : ""}"><td>Episode ${i + 1}</td><td class="mono">${names && names[i] ? esc(names[i]) : ""}</td>
      <td>ch. ${e.from}–${e.to}</td><td class="mono r">${fmtLen(e.secs)}${off ? " " + icon("alert", "width:13px;height:13px;vertical-align:-2px") : ""}</td></tr>`;
  }).join("");
  const anyOff = L.some(e => Math.abs(e.secs - avg) / avg > 0.15);
  return `<table class="lens">${rows}</table>` + (anyOff
    ? `<div class="hint warnTxt">Marked lengths are far from the average. Check the cuts, or pick the chapters yourself.</div>`
    : `<div class="hint">Total ${fmtLen(total)}. Episodes on the same disc are usually within a minute or two of each other.</div>`);
}
function splitLens(t, h) {   // short "47:21 · 48:02 · 46:44" for the title row, or "" if unknown
  if (!t.chapter_times || !h || h.how !== "split") return "";
  const pts = h.auto ? autoPts(t.chapter_times, t.chapter_total, h.eps) : h.pts;
  return pts ? epLengths(t.chapter_times, t.chapter_total, pts).map(e => fmtLen(e.secs)).join(" · ") : "";
}

function parsePts(text, chapters) {
  const parts = text.split(/[\s,]+/).filter(Boolean);
  if (!parts.length) throw new Error("Enter the chapters where episodes 2, 3, … start, or click Fill in.");
  const pts = [];
  for (const p of parts) { if (!/^\d+$/.test(p)) throw new Error(`"${p}" isn't a chapter number.`); pts.push(+p); }
  const u = [...new Set(pts)].sort((a, b) => a - b);
  if (u[0] < 2) throw new Error("Episode 1 always starts at chapter 1, so list where the next episodes start (2 or higher).");
  if (chapters && u[u.length - 1] > chapters) throw new Error(`This title only has ${chapters} chapters.`);
  return u;
}
function epCount(id) { const h = S.how[id]; return !h ? 1 : (h.how === "whole" || h.auto) ? h.eps : h.pts.length + 1; }
function firstEp(id) {
  let ep = +S.start || 0;
  for (const t of B.titles) { if (t.id === id) return ep; if (S.checked.has(t.id)) ep += epCount(t.id); }
  return ep;
}
function request() {
  return { mode: S.mode, prefix: S.prefix, start: S.start, movie: S.movie, movie_folder: S.movieFolder, out: S.out,
    titles: B.titles.filter(t => S.checked.has(t.id)).map(t => ({ id: t.id, ...(S.how[t.id] || {how: "single"}) })) };
}
let saveT = 0;
function persist() {
  clearTimeout(saveT);
  saveT = setTimeout(() => api.save_settings({ mode: S.mode, prefix: S.prefix, out: S.out, minlen: S.minlen, movie_folder: S.movieFolder }), 400);
}

/* ---------- rendering ---------- */
let prevT = 0;
function refreshNames() {
  clearTimeout(prevT);
  prevT = setTimeout(async () => {
    const r = await api.preview(request());
    S.names = r.names || {}; S.nameErr = r.error || "";
    renderTitles(); renderFooter();
  }, 60);
}

function renderTitles() {
  const box = $("#tlist");
  const sub = $("#pickSub");
  if (!B.titles.length) {
    sub.textContent = "";
    box.innerHTML = B.scan_id && !B.busy
      ? `<div class="empty"><div>${icon("disc")}<b>No titles found</b>Try lowering the minimum length in Settings, then scan again.</div></div>`
      : `<div class="empty"><div>${icon("disc")}<b>No disc scanned yet</b>Insert a disc and click <b style="display:inline">Scan disc</b>.</div></div>`;
    $("#playAllNote").hidden = $("#multiNote").hidden = true;
    return;
  }
  const n = S.checked.size;
  sub.textContent = `${B.titles.length} title${B.titles.length === 1 ? "" : "s"} · ${n} selected`;
  let html = `<div class="trow head"><span></span><span>Title</span><span>Length</span><span class="ch">Chapters</span><span class="sz">Size</span><span>Episodes</span><span>Saved as</span></div>`;
  let warnT = null;
  for (const t of B.titles) {
    const on = S.checked.has(t.id), pa = isPlayAll(t), h = S.how[t.id], multi = likelyMulti(t);
    if (multi && on && !warnT) warnT = t;
    let pill;
    if (S.mode === "movie") pill = `<span class="pill none">—</span>`;
    else if (pa) pill = `<span class="pill mute" title="This title is the other titles joined together">Play all · skip</span>`;
    else if (h && h.how === "split") { const ls = splitLens(t, h);
      pill = `<button class="pill accent" data-eps="${t.id}" title="${ls ? "Episode lengths: " + ls : "Lengths are shown after ripping, before splitting"}">${icon("scissors")}${epCount(t.id)} episodes · split</button>` +
        (ls ? `<div class="lenline mono">${ls}</div>` : ""); }
    else if (h && h.how === "whole") pill = `<button class="pill accent" data-eps="${t.id}">${icon("file")}${h.eps} episodes · one file</button>`;
    else if (multi) pill = `<button class="pill warn" data-eps="${t.id}">${icon("alert")}Several episodes?</button>`;
    else pill = `<button class="pill" data-eps="${t.id}" title="Split this title into episodes">1 episode</button>`;
    const names = S.names[String(t.id)] || [];
    let out = `<span class="out none">${on ? (S.nameErr ? esc(S.nameErr) : "") : "Not ripped"}</span>`;
    if (on && names.length) {
      const base = s => s.split(/[\\/]/).pop();
      out = names.length > 1
        ? `<span class="out" title="${esc(names.join("\n"))}">${esc(base(names[0]))}<span class="arrow">→</span>${esc(base(names[names.length - 1]))}</span>`
        : `<span class="out" title="${esc(names[0])}">${esc(names[0])}</span>`;
    }
    html += `<div class="trow t ${on ? "on" : ""} ${pa ? "skip" : ""}" data-id="${t.id}">
      <input type="checkbox" ${on ? "checked" : ""} tabindex="-1">
      <span class="num">${esc(t.label)}</span><span class="len">${esc(t.duration || "")}</span>
      <span class="ch">${t.chapters || ""}</span><span class="sz">${esc(t.size || "")}</span>
      <span>${pill}</span>${out}</div>`;
  }
  box.innerHTML = html;

  const pa = Object.entries(B.play_all || {})[0];
  if (pa) {
    const big = byId(+pa[0]), eps = pa[1].map(id => byId(id)?.label).join(", ");
    $("#playAllNote span").textContent = `Title ${big?.label} is “Play all” — titles ${eps} back to back. ` +
      (S.mode === "tv" ? "The episode titles are selected for you, in order." : "");
  }
  $("#playAllNote").hidden = !pa;
  $("#multiNote").hidden = !warnT;
  if (warnT) {
    $("#multiNote span").textContent = `Title ${warnT.label} is ${warnT.duration} long, so it probably holds several episodes.`;
    $("#multiBtn").onclick = () => openEpisodes(warnT.id);
  }
}

function renderNaming() {
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.mode === S.mode));
  $("#tvFields").hidden = $("#prefix").hidden = S.mode !== "tv";
  $("#movieFields").hidden = $("#movie").hidden = S.mode !== "movie";
  $("#nameLbl").textContent = S.mode === "tv" ? "Name prefix" : "Movie name";
  if (S.mode === "tv") {
    const s = +S.start || 0;
    $("#nameHint").innerHTML = `Selected titles are numbered top to bottom: <code>${esc(S.prefix)}${s}.mkv</code>, <code>${esc(S.prefix)}${s + 1}.mkv</code>, …  For the next disc, set First episode to continue.`;
  } else {
    const m = S.movie.trim() || "The Matrix (1999)";
    $("#nameHint").innerHTML = S.movieFolder
      ? `Saved as <code>${esc(m)}${isMac() ? "/" : "\\"}${esc(m)}.mkv</code>. Any other selected titles go in the same folder as extras.`
      : `Saved as <code>${esc(m)}.mkv</code> straight in the folder below, no subfolder. Other selected titles are saved beside it as extras.`;
  }
}

function renderHeader() {
  $("#ver").textContent = B.build ? `build ${B.build}` : "";
  const tools = B.tools || {};
  const mk = $("#chipMakeMKV"), mm = $("#chipMKVToolNix");
  mk.className = "chip tool " + (tools.makemkv ? "ok" : "bad");
  mm.className = "chip tool " + (tools.mkvmerge ? "ok" : "warn");
  mk.title = tools.makemkv || "Not installed"; mm.title = tools.mkvmerge || "Not installed (only needed for splitting)";
  $("#missingBanner").hidden = !!tools.makemkv || B.task === "install";
  const u = $("#updChip");
  u.hidden = !B.update;
  if (B.update) u.querySelector("span").textContent = `Update to build ${B.update.build}`;
}

function renderDisc() {
  const key = JSON.stringify(B.drives);
  if (key !== drivesKey) {
    drivesKey = key;
    const sel = $("#drive"), prev = sel.value;
    sel.innerHTML = B.drives.length
      ? B.drives.map(d => `<option value="${d.index}">${esc(d.disc || "No disc")}  —  ${esc(d.name)}</option>`).join("")
      : `<option value="">No disc drives found</option>`;
    if (B.drives.some(d => String(d.index) === prev)) sel.value = prev;
    else { const w = B.drives.find(d => d.disc); if (w) sel.value = w.index; }
  }
  $("#scanBtn").disabled = B.busy || !B.drives.length || !(B.tools || {}).makemkv;
  $("#refreshBtn").disabled = B.busy || !(B.tools || {}).makemkv;
}

function renderFooter() {
  const n = request().titles.reduce((a, r) => a + (r.how === "whole" ? 1 : r.how === "split" ? (r.auto ? r.eps : r.pts.length + 1) : 1), 0);
  $("#ripBtn span").textContent = B.busy && B.task === "rip" ? "Ripping…" : n ? `Rip ${n} file${n === 1 ? "" : "s"}` : "Rip";
  $("#ripBtn").disabled = B.busy || !S.checked.size;
  const bar = $("#bar");
  const working = B.busy;
  bar.classList.toggle("indet", working && (B.progress == null));
  bar.querySelector("i").style.width = working && B.progress != null ? `${Math.round(B.progress * 100)}%`
    : (!working && B.result ? "100%" : "0%");
  const pct = working && B.progress != null ? ` <b>${Math.round(B.progress * 100)}%</b>` : "";
  $("#status").innerHTML = esc(B.status || "Ready") + pct;
}

function renderAll() { renderHeader(); renderDisc(); renderNaming(); renderTitles(); renderFooter(); }

/* ---------- toasts & dialogs ---------- */
function toast(kind, text) {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = `<span class="ti">${icon(kind === "error" ? "alert" : "check")}</span><span>${esc(text)}</span><button class="x">${icon("x", "width:15px;height:15px")}</button>`;
  el.querySelector(".x").onclick = () => el.remove();
  $("#toasts").appendChild(el);
  if (kind !== "error") setTimeout(() => el.remove(), 7000);
}
function dialog(html, onMount, modal = false) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="dlg">${html}</div>`;
  const close = () => { scrim.remove(); document.removeEventListener("keydown", key); };
  const key = e => { if (e.key === "Escape" && !modal) close(); };
  document.addEventListener("keydown", key);
  scrim.addEventListener("mousedown", e => { if (e.target === scrim && !modal) close(); });
  $("#dialogs").appendChild(scrim);
  onMount && onMount(scrim.querySelector(".dlg"), close);
  return close;
}
function confirmBox(title, body, okText, cb, danger = false) {
  dialog(`<div class="dh"><h3>${esc(title)}</h3></div><div class="content">${body}</div>
    <div class="df"><div class="spacer"></div><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>${esc(okText)}</button></div>`,
    (d, close) => { d.querySelector("[data-x]").onclick = close; d.querySelector("[data-ok]").onclick = () => { close(); cb(); }; d.querySelector("[data-ok]").focus(); });
}

function openEpisodes(id) {
  const t = byId(id);
  if (!t || S.mode !== "tv" || B.busy) return;
  const h = S.how[id];
  let eps = h ? epCount(id) : Math.max(2, t.secs >= 70 * 60 ? Math.round(t.secs / 60 / 45) : 2);
  let how = h && h.how === "whole" ? "whole" : "split";
  let manual = !!(h && h.how === "split" && !h.auto);
  dialog(`
    <div class="dh"><h3>Episodes in title ${esc(t.label)}</h3><p>${esc(t.duration)} long · ${t.chapters || "?"} chapters</p></div>
    <div class="content">
      <div class="row" style="margin-bottom:14px"><span style="flex:1">How many episodes are in this title?</span>
        <span class="stepper"><button data-d="-1">−</button><input id="eN" value="${eps}"><button data-d="1">+</button></span></div>
      <label class="opt" data-how="split">
        <span class="ot"><input type="radio" name="how">${icon("scissors", "width:16px;height:16px")}Split into separate episode files</span>
        <div class="ob">
          <div class="row" style="gap:16px">
            <label class="switch"><input type="radio" name="pick" id="eAuto"> Find the cuts automatically</label>
            <label class="switch"><input type="radio" name="pick" id="eMan"> I'll enter the chapters</label></div>
          <div class="hint" id="eAutoTxt" style="margin-top:6px">Cuts at the chapters that give the most even episode lengths.</div>
          <div class="row" id="eManRow" style="margin-top:8px"><span>New episodes start at chapters</span><input class="input mono" id="ePts" style="width:120px" spellcheck="false" placeholder="7,13">
            <button class="btn sm" id="eFill">Fill in</button></div>
          <div class="hint" id="eHint" style="margin-top:6px"></div>
          <div id="eLens" style="margin-top:10px"></div>
          <div class="hint" style="margin-top:6px">If the split doesn't work out, the title is saved as one file instead, so nothing is lost.</div>
        </div>
      </label>
      <label class="opt" data-how="whole">
        <span class="ot"><input type="radio" name="how">${icon("file", "width:16px;height:16px")}Keep as one file with all the episodes</span>
        <div class="ob"><div>Saved as <code class="mono" id="eWhole"></code></div>
          <div class="hint" style="margin-top:4px">Plex lists every episode, but playing any of them plays the whole file.</div></div>
      </label>
      <div class="callout err" id="eErr" hidden style="margin:4px 0 0"></div>
    </div>
    <div class="df"><button class="btn ghost" data-single>It's just one episode</button><div class="spacer"></div>
      <button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>`,
  (d, close) => {
    const N = d.querySelector("#eN"), P = d.querySelector("#ePts"), hint = d.querySelector("#eHint");
    P.value = h && h.how === "split" ? h.pts.join(",") : "";
    const nEps = () => Math.max(2, Math.min(50, parseInt(N.value) || 2));
    const fill = () => {
      const a = t.chapter_times && autoPts(t.chapter_times, t.chapter_total, nEps());
      if (a) { P.value = a.join(","); hint.textContent = "Filled in the most even cuts. Change any number and the lengths update."; return; }
      const g = guessPts(t.chapters, nEps());
      if (g) { P.value = g.join(","); hint.textContent = `Filled in ${t.chapters / nEps()} chapters per episode. It's a guess — check one episode change in VLC if you can.`; }
      else hint.textContent = `${t.chapters} chapters don't divide evenly into ${nEps()} episodes, so type the chapters in yourself.`;
    };
    const sync = () => {
      d.querySelectorAll(".opt").forEach(o => { o.classList.toggle("on", o.dataset.how === how); o.querySelector(".ot input").checked = o.dataset.how === how; });
      d.querySelector("#eAuto").checked = !manual; d.querySelector("#eMan").checked = manual;
      d.querySelector("#eManRow").hidden = !manual; d.querySelector("#eAutoTxt").hidden = manual; hint.hidden = !manual;
      const f = firstEp(id); d.querySelector("#eWhole").textContent = multiName(f, f + nEps() - 1);
      showLens();
    };
    const showLens = () => {
      const box = d.querySelector("#eLens");
      if (!t.chapter_times) {
        box.innerHTML = `<div class="hint">MKV Ripper couldn't read the chapter times from the disc, so it will show you the episode lengths after ripping this title and wait for your OK before splitting.</div>`;
        return;
      }
      let pts = null;
      if (manual) { try { pts = parsePts(P.value, t.chapters); } catch (e) { box.innerHTML = ""; return; } }
      else pts = autoPts(t.chapter_times, t.chapter_total, nEps());
      if (!pts) { box.innerHTML = `<div class="hint warnTxt">Can't make ${nEps()} episodes from ${t.chapters} chapters.</div>`; return; }
      const f = firstEp(id);
      box.innerHTML = (manual ? "" : `<div class="hint" style="margin-bottom:4px">Cuts at chapters <b class="mono">${pts.join(", ")}</b></div>`) +
        lengthsTable(t.chapter_times, t.chapter_total, pts, pts.concat(0).map((_, i) => (S.prefix || "") + (f + i)));
    };
    d.querySelectorAll(".opt").forEach(o => o.addEventListener("click", () => { how = o.dataset.how; sync(); }));
    d.querySelectorAll(".stepper button").forEach(b => b.onclick = e => { e.preventDefault(); N.value = nEps() + +b.dataset.d; if (manual) fill(); sync(); });
    N.oninput = () => { sync(); };
    P.oninput = () => showLens();
    d.querySelector("#eFill").onclick = e => { e.preventDefault(); fill(); showLens(); };
    d.querySelector("#eAuto").onchange = () => { manual = false; sync(); };
    d.querySelector("#eMan").onchange = () => { manual = true; if (!P.value) fill(); sync(); };
    sync();
    d.querySelector("[data-x]").onclick = close;
    d.querySelector("[data-single]").onclick = () => { delete S.how[id]; close(); refreshNames(); };
    const save = () => {
      const err = d.querySelector("#eErr");
      try {
        S.how[id] = how === "whole" ? { how: "whole", eps: nEps() }
          : manual ? { how: "split", pts: parsePts(P.value, t.chapters) } : { how: "split", auto: true, eps: nEps() };
      } catch (e) { err.textContent = e.message; err.hidden = false; return; }
      S.checked.add(id); close(); refreshNames();
    };
    d.querySelector("[data-ok]").onclick = save;
    d.addEventListener("keydown", e => { if (e.key === "Enter") save(); });
  });
}

function openSettings() {
  const tools = B.tools || {};
  const row = (key, pkg, path, what) => `
    <div class="setrow"><div class="sh">${esc(pkg)}<span class="chip ${path ? "ok" : key === "makemkv" ? "bad" : "warn"}"><span class="dot"></span>${path ? "Installed" : "Not installed"}</span></div>
      <div class="row"><input class="input grow1 mono" data-path="${key}" value="${esc(path)}" spellcheck="false" placeholder="Not found">
        <button class="btn sm" data-browse="${key}">Browse…</button>
        <button class="btn sm" data-install="${esc(pkg)}">${howInstall(pkg) === "page" ? "Download page" : path ? "Update" : "Install"}</button></div>
      <div class="hint">${what}</div></div>`;
  dialog(`
    <div class="dh"><h3>Settings</h3></div>
    <div class="content">
      ${row("makemkv", "MakeMKV", tools.makemkv || "", isMac() ? "Reads your discs. On a Mac it comes from makemkv.com: the button opens its download page, for installing or updating." : "Reads your discs. Installed and updated with Windows Package Manager (winget).")}
      ${row("mkvmerge", "MKVToolNix", tools.mkvmerge || "", "Only needed to split a title into separate episodes.")}
      <div class="setrow"><div class="sh">Scanning</div>
        <div class="row"><span>Hide titles shorter than</span><input class="input num" id="sMin" type="number" min="0" step="30" value="${S.minlen}"><span>seconds</span></div>
        <div class="hint">Lower this if a short episode or extra doesn't show up. Scan again after changing it.</div></div>
      <div class="setrow"><div class="sh">About</div>
        <div class="row"><span>${B.build ? `MKV Ripper build ${B.build}` : "MKV Ripper (running from source)"}</span><span class="hint" id="sUpd" style="margin:0"></span>
          <div class="spacer"></div><button class="btn sm" id="sCheck">Check for updates</button></div></div>
    </div>
    <div class="df"><div class="spacer"></div><button class="btn primary" data-x>Done</button></div>`,
  (d, close) => {
    d.querySelector("[data-x]").onclick = close;
    d.querySelectorAll("[data-browse]").forEach(b => b.onclick = async () => {
      const p = await api.browse_tool(b.dataset.browse);
      if (p) d.querySelector(`[data-path="${b.dataset.browse}"]`).value = p;
    });
    d.querySelectorAll("[data-path]").forEach(i => i.onchange = () => api.set_tool(i.dataset.path, i.value));
    d.querySelectorAll("[data-install]").forEach(b => b.onclick = () => { close(); installTool(b.dataset.install); });
    d.querySelector("#sMin").onchange = e => { S.minlen = Math.max(0, parseInt(e.target.value) || 0); persist(); };
    d.querySelector("#sCheck").onclick = async () => {
      const s = d.querySelector("#sUpd"); s.textContent = "Checking…";
      const r = await api.check_update();
      if (r.error) {
        s.innerHTML = `${esc(r.error)}<br><button class="btn sm" id="sDl" style="margin-top:6px">Open the download page</button>`;
        s.querySelector("#sDl").onclick = () => api.open_releases();
        return;
      }
      s.textContent = r.latest ? "You have the latest build." : `Build ${r.build} is available — use the button at the top.`;
    };
  });
}

const isMac = () => B.platform === "mac";
const howInstall = pkg => ((B.tools || {}).installer || {})[pkg] || "winget";
function installTool(pkg) {
  const lic = pkg === "MakeMKV" ? "<p>MakeMKV has its own license and beta key; installing it means you accept its terms.</p>" : "";
  const how = howInstall(pkg);
  if (how === "page") {
    const steps = pkg === "MakeMKV"
      ? "Download the Mac version, open the .dmg, and drag MakeMKV into Applications."
      : "Download the Mac .dmg, open it, and drag MKVToolNix into Applications.";
    return confirmBox(`Get ${pkg}`, `<p style="margin:0 0 8px">${pkg}'s download page will open in your browser. ${steps} MKV Ripper finds it by itself once it's there.</p>${lic}`,
      "Open download page", async () => { await api.install_tool(pkg); poll(); });
  }
  const tool = how === "brew" ? "Homebrew" : "Windows Package Manager (winget)";
  const ask = how === "brew" ? "" : " Windows may ask for permission.";
  confirmBox(`Install or update ${pkg}?`, `<p style="margin:0 0 8px">MKV Ripper will use ${tool} to get the latest ${esc(pkg)}.${ask}</p>${lic}`,
    "Continue", async () => { await api.install_tool(pkg); poll(); });
}

async function startRip(force = false) {
  const r = await api.rip(request(), force);
  if (r.error) return toast("error", r.error);
  if (r.confirm === "overwrite")
    return confirmBox("Replace existing files?", `These files are already in the folder and will be replaced:<div class="filelist">${r.files.map(esc).join("<br>")}</div>`,
      "Replace and rip", () => startRip(true));
  if (r.confirm === "nosplit")
    return confirmBox("MKVToolNix isn't installed", `<p style="margin:0">Splitting needs MKVToolNix. You can install it from Settings, or rip now and keep those titles as one multi-episode file each (like <code class="mono">S1E1-E3.mkv</code>).</p>`,
      "Rip as one file each", () => startRip(true));
  poll();
}

function showResult(res) {
  dialog(`<div class="dh"><h3>${icon("check", "width:20px;height:20px;color:var(--ok);vertical-align:-4px;margin-right:6px")}Done</h3>
      <p>Saved ${res.done} file${res.done === 1 ? "" : "s"} to ${esc(res.out)}</p></div>
    <div class="content">${res.notes.length ? `<div class="callout warn" style="display:block">${res.notes.map(esc).join("<br>")}</div>` : `<div class="hint" style="margin:0">Insert the next disc and scan it. For the next disc, set First episode to continue the numbering.</div>`}</div>
    <div class="df"><div class="spacer"></div><button class="btn" data-open>${icon("folder")}Open folder</button><button class="btn primary" data-x>OK</button></div>`,
  (d, close) => { d.querySelector("[data-x]").onclick = close; d.querySelector("[data-open]").onclick = () => api.open_folder(res.out); });
}

/* ---------- check lengths after ripping, before splitting ---------- */
let reviewOpen = null;
function openReview(r) {
  const key = r.label + "|" + r.pts.join(",");
  if (reviewOpen === key) return;
  reviewOpen = key;
  dialog(`
    <div class="dh"><h3>Check the episodes in title ${esc(r.label)}</h3>
      <p>Ripped: ${fmtLen(r.total)} · ${r.times.length} chapters. Nothing is split until you say so.</p></div>
    <div class="content">
      <div class="row"><span>New episodes start at chapters</span><input class="input mono" id="rPts" style="width:140px" spellcheck="false">
        <button class="btn sm" id="rAuto">Most even</button></div>
      <div class="callout err" id="rErr" hidden style="margin:8px 0 0"></div>
      <div id="rLens" style="margin-top:10px"></div>
      <details style="margin-top:10px"><summary class="hint">Chapter start times</summary>
        <div class="chaps mono">${r.times.map((x, i) => `<span>${i + 1}<b>${fmtLen(x)}</b></span>`).join("")}</div></details>
    </div>
    <div class="df"><button class="btn ghost" data-whole>Keep as one file</button><div class="spacer"></div>
      <button class="btn primary" data-ok>Split here</button></div>`,
  (d, close) => {
    const P = d.querySelector("#rPts"), err = d.querySelector("#rErr"), box = d.querySelector("#rLens");
    P.value = (r.pts.length ? r.pts : autoPts(r.times, r.total, r.episodes) || []).join(",");
    const show = () => {
      err.hidden = true;
      try { const pts = parsePts(P.value, r.times.length); box.innerHTML = lengthsTable(r.times, r.total, pts, r.names); return pts; }
      catch (e) { box.innerHTML = ""; err.textContent = e.message; err.hidden = false; return null; }
    };
    P.oninput = show;
    d.querySelector("#rAuto").onclick = () => { P.value = (autoPts(r.times, r.total, r.episodes) || []).join(","); show(); };
    d.querySelector("[data-ok]").onclick = async () => { const pts = show(); if (!pts) return; close(); await api.review_answer({ pts }); };
    d.querySelector("[data-whole]").onclick = async () => { close(); await api.review_answer({ whole: true }); };
    show();
  }, true);
}

/* ---------- polling ---------- */
async function poll() {
  let st;
  try { st = await api.get_state(logFrom); } catch (e) { return; }
  const wasBusy = B.busy, prevTask = B.task;
  B = st;
  if (st.log && st.log.length) {
    const lb = $("#logbox"), atEnd = lb.scrollTop + lb.clientHeight >= lb.scrollHeight - 4;
    lb.textContent += st.log.join("\n") + "\n";
    if (lb.textContent.length > 200000) lb.textContent = lb.textContent.slice(-150000);
    if (atEnd) lb.scrollTop = lb.scrollHeight;
  }
  logFrom = st.log_end;
  for (const n of st.notices || []) if (n.id > seenNotice) { seenNotice = n.id; toast(n.kind, n.text); }
  if (st.scan_id !== seenScan) {          // a new scan: reset the choices
    seenScan = st.scan_id;
    S.checked = new Set(); S.how = {};
    const pa = Object.values(st.play_all || {})[0];
    if (pa && S.mode === "tv") pa.forEach(id => S.checked.add(id));
    refreshNames();
  }
  if (wasBusy && !st.busy && prevTask === "rip" && st.result && st.result !== lastResult) { lastResult = st.result; showResult(st.result); }
  if (st.review) openReview(st.review); else reviewOpen = null;
  renderHeader(); renderDisc(); renderFooter();
  if (wasBusy !== st.busy) renderTitles();
}

/* ---------- wiring ---------- */
function wire() {
  $("#scanBtn").onclick = async () => { await api.scan(+$("#drive").value, S.minlen); poll(); };
  $("#refreshBtn").onclick = async () => { await api.refresh_drives(); poll(); };
  $("#drive").onchange = () => renderDisc();
  $("#settingsBtn").onclick = openSettings;
  $("#installMakeMKV").onclick = () => installTool("MakeMKV");
  $("#updChip").onclick = () => confirmBox(`Update to build ${B.update.build}?`, "<p style='margin:0'>MKV Ripper will download the new version and restart.</p>",
    "Update and restart", async () => {
      const r = await api.apply_update();
      if (r.move) offerMove(true); else if (r.error) toast("error", r.error);
    });
  $("#allBtn").onclick = () => { B.titles.forEach(t => { if (!isPlayAll(t)) S.checked.add(t.id); }); refreshNames(); };
  $("#noneBtn").onclick = () => { S.checked.clear(); refreshNames(); };
  $("#tlist").addEventListener("click", e => {
    const pill = e.target.closest("[data-eps]");
    if (pill) { openEpisodes(+pill.dataset.eps); return; }
    const row = e.target.closest(".trow.t");
    if (!row || B.busy) return;
    const id = +row.dataset.id;
    S.checked.has(id) ? S.checked.delete(id) : S.checked.add(id);
    refreshNames();
  });
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    S.mode = b.dataset.mode; persist(); renderNaming(); refreshNames();
  });
  $("#prefix").oninput = e => { S.prefix = e.target.value; persist(); renderNaming(); refreshNames(); };
  $("#start").oninput = e => { S.start = e.target.value; renderNaming(); refreshNames(); };
  $("#movie").oninput = e => { S.movie = e.target.value; renderNaming(); refreshNames(); };
  $("#movieFolder").onchange = e => { S.movieFolder = e.target.checked; persist(); renderNaming(); refreshNames(); };
  $("#out").oninput = e => { S.out = e.target.value; persist(); };
  $("#browseOut").onclick = async () => { const p = await api.choose_folder(S.out); if (p) { S.out = p; $("#out").value = p; persist(); } };
  $("#ripBtn").onclick = () => startRip(false);
  $("#logBtn").onclick = () => { const l = $("#logbox"); l.hidden = !l.hidden; if (!l.hidden) l.scrollTop = l.scrollHeight; };
}

async function init() {
  api = window.pywebview.api;
  const st = await api.startup();
  const s = st.settings || {};
  S.mode = s.mode || "tv"; S.prefix = s.prefix ?? "S1E"; S.out = s.out || ""; S.minlen = +(s.minlen ?? 120);
  S.movieFolder = !!s.movie_folder; $("#movieFolder").checked = S.movieFolder;
  $("#prefix").value = S.prefix; $("#out").value = S.out; $("#start").value = S.start;
  B = st; logFrom = st.log_end || 0;
  wire(); renderAll(); refreshNames();
  setInterval(poll, 400);
  if (B.move_offer) offerMove();
}

/* Mac: the app should live in Applications (it can't update itself from Downloads or the .dmg) */
function offerMove(forUpdate = false) {
  dialog(`
    <div class="dh"><h3>Move MKV Ripper to Applications?</h3>
      <p>It's running from your Downloads folder or the disk image.</p></div>
    <div class="content">
      <p style="margin:0 0 8px">${forUpdate ? "To install the update, MKV Ripper first has to be in your Applications folder: macOS doesn't let a downloaded app change itself until it's there."
        : "MKV Ripper needs to be in your Applications folder to update itself and to show up in Launchpad."}
        It will copy itself there and reopen${forUpdate ? "; then click Update again" : ""}.</p>
      <div class="callout err" id="mvErr" hidden></div>
    </div>
    <div class="df"><button class="btn ghost" data-x>Not now</button><div class="spacer"></div>
      <button class="btn primary" data-ok>Move to Applications</button></div>`,
  (d, close) => {
    const ok = d.querySelector("[data-ok]"), err = d.querySelector("#mvErr");
    d.querySelector("[data-x]").onclick = close;
    ok.onclick = async () => {
      ok.disabled = true; ok.textContent = "Moving…";
      const r = await api.move_to_applications();
      if (r && r.error) { err.textContent = r.error; err.hidden = false; ok.disabled = false; ok.textContent = "Try again"; }
      else ok.textContent = "Reopening…";
    };
    ok.focus();
  });
}
if (window.pywebview && window.pywebview.api) init();
else window.addEventListener("pywebviewready", init);
</script>
</body>
</html>
